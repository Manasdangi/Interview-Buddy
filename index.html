<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <meta name="description" content="Free AI mock interviews for frontend engineers. Practise company-style rounds for Amazon, Flipkart, OpenAI and 100+ companies with voice, a code editor and a detailed report." />
    <title>Interview Buddy — AI frontend mock interviews</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Light is the default.
      try {
        if (localStorage.getItem('interview-buddy:theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#020617')
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
